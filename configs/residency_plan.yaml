# LocalRuntime Device Residency Plan
# Defines which models run on each device (NPU/GPU/CPU)

devices:
  NPU:
    memory: 2GB
    residents: [asr_encoder, embedding]  # ASR encoder + Qwen3 Embedding
    candidates: []
  GPU:
    memory: shared
    residents: [llm, vlm]        # LLM (5.2GB) + VLM (2.9GB)
    candidates: []
  CPU:
    memory: shared
    residents: [asr_seq, tts]    # ASR thinker/decoder + TTS (qwen-tts)
    fallback: true

engines:
  chat:
    model: Qwen3.5-2B-fp16-ov
    device: GPU
    port: 31000
  vision:
    model: Qwen3-VL-4B-Instruct-int4_asym-ov
    device: GPU
    port: 31001
  asr:
    model: Qwen3-ASR-0.6B-int8-ov
    device: NPU        # audio_encoder on NPU, thinker/decoder on CPU
    port: 31002
  tts:
    model: Qwen3-TTS-0.6B-CustomVoice
    device: CPU        # qwen-tts PyTorch, no OpenVINO path
    port: 31003
  embedding:
    model: Qwen3-Embedding-0.6B-fp16-ov
    device: NPU
    port: 31004
  rerank:
    model: Qwen3-Reranker-0.6B-fp16-ov
    device: GPU
    port: 31005

serving_notes:
  - "ASR audio_encoder (356MB) runs on NPU, thinker+decoder on CPU (dynamic shapes)"
  - "Qwen3-ASR-1.7B thinker layout runs through the isolated helper runtime on GPU, with CPU fallback"
  - "LLM + VLM share GPU memory, total ~8.1GB"
  - "TTS uses qwen-tts PyTorch package — CPU only, no NPU/GPU path"
  - "Embedding uses the OpenVINO GenAI RAG pipeline on NPU, with GPU/CPU fallback"
  - "Rerank uses the OpenVINO GenAI RAG pipeline on GPU, with CPU fallback"
  - "All engines fall back to CPU when preferred device is unavailable"
